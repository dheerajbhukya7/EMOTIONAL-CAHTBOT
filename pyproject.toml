[project]
name = "gen-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dheerajbhukya7e", email = "bhukya.dheeraj7@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.6.0",
    "langchain[huggingface]>=1.3.17",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
]

[project.scripts]
gen-ai = "gen_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

